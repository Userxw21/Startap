services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier_dev_password
      POSTGRES_DB: courier_platform
    ports:
      - "5432:5432"
    volumes:
      - courier_postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier -d courier_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  courier_postgres_data:
